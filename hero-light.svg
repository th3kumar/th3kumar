<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img">
<title>Mantu Kumar. Android and web engineer. Daytime in India  ·  somewhere inside a Compose screen</title>
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif}
  @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(90px,30px)}}
  @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-110px,-25px)}}
  @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,40px)}}
  .o1{animation:d1 26s ease-in-out infinite}.o2{animation:d2 32s ease-in-out infinite}.o3{animation:d3 38s ease-in-out infinite}
  @keyframes en{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
  @keyframes hi{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
  .en{animation:en 10s ease-in-out infinite}.hi{opacity:0;animation:hi 10s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
  .st{animation:tw 5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  .dot{animation:breathe 3.6s ease-in-out infinite}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .a{opacity:0;animation:fadeUp 1.1s cubic-bezier(.22,1,.36,1) .2s forwards}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.a,.en{opacity:1}.hi{display:none}}
</style>
<defs>
  <clipPath id="clip"><rect width="1200" height="340" rx="28"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3f8fc"/><stop offset="1" stop-color="#eef4f1"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#9cc6e8" stop-opacity="0.55"/><stop offset="1" stop-color="#9cc6e8" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#a7d0bd" stop-opacity="0.55"/><stop offset="1" stop-color="#a7d0bd" stop-opacity="0"/></radialGradient><radialGradient id="g3"><stop offset="0" stop-color="#f4d98f" stop-opacity="0.55"/><stop offset="1" stop-color="#f4d98f" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <g class="o1"><circle cx="830" cy="90" r="260" fill="url(#g1)"/></g>
  <g class="o2"><circle cx="1060" cy="250" r="240" fill="url(#g2)"/></g>
  <g class="o3"><circle cx="700" cy="330" r="200" fill="url(#g3)"/></g>
  <circle cx="1040" cy="126" r="34" fill="#fff6dc" fill-opacity="0.92"/>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="27.5" stroke="#0f172a" stroke-opacity=".08"/>
<g class="t a">
  <rect x="72" y="40" width="382" height="30" rx="15" fill="#0f172a" fill-opacity="0.05"/>
  <circle class="dot" cx="90" cy="55" r="4" fill="#5f9c86"/>
  <text x="102" y="59.5" font-size="13" fill="#5b6572">Daytime in India  ·  somewhere inside a Compose screen</text>
  <text class="en" x="74" y="118" font-size="15" letter-spacing="1.5" fill="#5b6572">HI, I'M</text>
  <text class="hi" x="74" y="118" font-size="17" fill="#5b6572">नमस्ते, मैं</text>
  <text x="72" y="180" font-size="60" font-weight="600" letter-spacing="-1.5" fill="#1f2328">Mantu Kumar</text>
  <text x="74" y="222" font-size="21" fill="#5b6572">Android &amp; web engineer. I build calm, tactile interfaces.</text>
  <text x="74" y="288" font-size="13.5" letter-spacing=".4" fill="#98a1ac">SOFTWARE ENGINEER II @ VAHAN   ·   FOUNDER, ANATOMYGO</text>
  <rect x="741" y="40" width="419" height="30" rx="15" fill="#0f172a" fill-opacity="0.05"/><text x="756" y="59.5" font-size="13" fill="#5b6572">Last shipped  ·  what's new: the scalpel, for diss…  ·  4 days ago</text>
</g>
