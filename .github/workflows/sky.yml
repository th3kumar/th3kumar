name: Sky header

# Redraws the time-of-day header (light + dark) and publishes it to the `output` branch.
# Runs every hour at :35, just after India's dawn/day/dusk/night boundaries (which fall on :30 UTC).
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/sky.py, .github/workflows/sky.yml]

permissions:
  contents: write

concurrency:
  group: sky
  cancel-in-progress: true

jobs:
  sky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw the sky
        run: python3 scripts/sky.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sky header"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
