<svg xmlns="http://www.w3.org/2000/svg" width="580" height="236" viewBox="0 0 580 236" fill="none" role="img">
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,14px)}}
  .orb{animation:drift 24s ease-in-out infinite}
  .dot{animation:breathe 3.6s ease-in-out infinite}
  @keyframes br{0%,100%{transform:scale(.8)}50%{transform:scale(1.12)}}
  .br{transform-box:fill-box;transform-origin:center;animation:br 10s ease-in-out infinite}
</style>

<defs>
  <clipPath id="c"><rect width="580" height="236" rx="22"/></clipPath>
  <radialGradient id="g"><stop offset="0" stop-color="#8c87d6" stop-opacity="0.28500000000000003"/><stop offset="1" stop-color="#8c87d6" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="580" height="236" fill="#f6f7f9"/>
  <g class="orb"><circle cx="540" cy="-10" r="190" fill="url(#g)"/></g>
</g>

<rect x=".5" y=".5" width="579" height="235" rx="21.5" stroke="#0f172a" stroke-opacity="0.07"/>
<g class="t">
  <text x="32" y="72" font-size="26" font-weight="600" letter-spacing="-.4" fill="#1f2328">CINEVERSE</text>
  <rect x="413.8" y="28" width="138.2" height="28" rx="14" fill="#0f172a" fill-opacity="0.045"/>
  <circle cx="429.8" cy="42" r="3.5" fill="#8c87d6"/>
  <text x="439.8" y="46.5" font-size="12.5" fill="#5f6873">proof of concept</text>
  <text x="32" y="106" font-size="16" fill="#5f6873">An AI movie concierge that learns your vibe</text><text x="32" y="130" font-size="16" fill="#5f6873">from a few swipes, then finds the film.</text>
  <rect x="32.0" y="180" width="68.2" height="28" rx="14" fill="#0f172a" fill-opacity="0.045"/><text x="66.1" y="198.5" font-size="13" text-anchor="middle" fill="#5f6873">Next.js</text><rect x="108.2" y="180" width="93.8" height="28" rx="14" fill="#0f172a" fill-opacity="0.045"/><text x="155.1" y="198.5" font-size="13" text-anchor="middle" fill="#5f6873">TypeScript</text><rect x="210.0" y="180" width="53.5" height="28" rx="14" fill="#0f172a" fill-opacity="0.045"/><text x="236.8" y="198.5" font-size="13" text-anchor="middle" fill="#5f6873">Groq</text>
</g>

</svg>
