<svg xmlns="http://www.w3.org/2000/svg" width="580" height="236" viewBox="0 0 580 236" fill="none" role="img">
<style>
  .t{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,14px)}}
  .orb{animation:drift 24s ease-in-out infinite}
  .dot{animation:breathe 3.6s ease-in-out infinite}
  @keyframes br{0%,100%{transform:scale(.8)}50%{transform:scale(1.12)}}
  .br{transform-box:fill-box;transform-origin:center;animation:br 10s ease-in-out infinite}
</style>

<defs>
  <clipPath id="c"><rect width="580" height="236" rx="22"/></clipPath>
  <radialGradient id="g"><stop offset="0" stop-color="#8fb3d9" stop-opacity="0.41250000000000003"/><stop offset="1" stop-color="#8fb3d9" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#c)">
  <rect width="580" height="236" fill="#12171f"/>
  
</g>
<circle class="br" cx="488" cy="150" r="62" fill="url(#g)"/><circle class="br" cx="488" cy="150" r="44" fill="url(#g)"/><circle cx="488" cy="150" r="24" fill="#12171f" stroke="#ffffff" stroke-opacity=".1"/><path d="M482 141 L498 150 L482 159 Z" fill="#e8eaed" fill-opacity=".8"/>
<rect x=".5" y=".5" width="579" height="235" rx="21.5" stroke="#ffffff" stroke-opacity="0.07"/>
<g class="t">
  <text x="32" y="72" font-size="26" font-weight="600" letter-spacing="-.4" fill="#e8eaed">Snoozz</text>
  <rect x="439.4" y="28" width="112.6" height="28" rx="14" fill="#ffffff" fill-opacity="0.05"/>
  <circle class="dot" cx="455.4" cy="42" r="3.5" fill="#8fb3d9"/>
  <text x="465.4" y="46.5" font-size="12.5" fill="#8b94a3">tap to listen</text>
  <text x="32" y="106" font-size="16" fill="#8b94a3">A white-noise sleep buddy for Android.</text><text x="32" y="130" font-size="16" fill="#8b94a3">Tap to breathe along in your browser.</text>
  <rect x="32.0" y="180" width="61.3" height="28" rx="14" fill="#ffffff" fill-opacity="0.05"/><text x="62.7" y="198.5" font-size="13" text-anchor="middle" fill="#8b94a3">Kotlin</text><rect x="101.3" y="180" width="86.9" height="28" rx="14" fill="#ffffff" fill-opacity="0.05"/><text x="144.8" y="198.5" font-size="13" text-anchor="middle" fill="#8b94a3">ExoPlayer</text><rect x="196.2" y="180" width="83.9" height="28" rx="14" fill="#ffffff" fill-opacity="0.05"/><text x="238.2" y="198.5" font-size="13" text-anchor="middle" fill="#8b94a3">Web Audio</text>
</g>

</svg>
