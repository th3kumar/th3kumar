<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snoozz · breathe along</title>
<meta name="description" content="A few calm minutes of soft noise that rises and falls with your breath. From Snoozz by Mantu Kumar.">
<style>
:root{color-scheme:light dark;
  --bg:light-dark(#f6f7f9,#0d1117);--ink:light-dark(#1f2328,#e8eaed);--mute:light-dark(#5f6873,#8b94a3);
  --faint:light-dark(#9aa2ad,#5c6573);--line:light-dark(rgba(15,23,42,.08),rgba(255,255,255,.08));
  --chip:light-dark(rgba(15,23,42,.05),rgba(255,255,255,.06));--surface:light-dark(#ffffff,#12171f);
  --a:light-dark(#7ea3cc,#8fb3d9);--b:light-dark(#8c87d6,#a7a3e0);--c:light-dark(#6f9d89,#8fb8a6)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
  display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased}
main{width:min(560px,100% - 32px);display:grid;justify-items:center;text-align:center;gap:18px;padding:32px 0}
h1{font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:600}
.sub{color:var(--mute);margin:-6px 0 0;max-width:40ch}
.stage{position:relative;width:min(320px,78vw);aspect-ratio:1;display:grid;place-items:center;margin:8px 0}
.orb{position:absolute;inset:0;border-radius:50%;will-change:transform;transform:scale(.82)}
.orb.o1{background:radial-gradient(circle,color-mix(in srgb,var(--b) 55%,transparent) 0,transparent 68%)}
.orb.o2{inset:14%;background:radial-gradient(circle,color-mix(in srgb,var(--a) 70%,transparent) 0,transparent 70%)}
.play{position:relative;width:88px;height:88px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 30px -12px rgba(0,0,0,.25);transition:transform .4s cubic-bezier(.22,1,.36,1)}
.play:hover{transform:scale(1.04)}.play:active{transform:scale(.97)}
.play:focus-visible,.chip:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:3px}
.play svg{width:28px;height:28px}
.cue{height:22px;color:var(--mute);font-size:15px;letter-spacing:.02em;transition:opacity .8s ease}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.label{font-size:13px;color:var(--faint);margin:6px 0 -6px}
.chip{font:inherit;font-size:14px;min-height:40px;padding:0 16px;border-radius:99px;border:1px solid transparent;background:var(--chip);color:var(--mute);cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.chip[aria-pressed=true]{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:600}
.vol{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:13px;width:min(280px,100%)}
input[type=range]{flex:1;accent-color:var(--a);height:44px}
.left{font-size:13px;color:var(--faint);min-height:20px}
footer{font-size:13px;color:var(--faint)}footer a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>Snoozz</h1>
  <p class="sub">Soft noise that rises and falls with your breath. Press play, and breathe along with the circle.</p>

  <div class="stage" aria-hidden="false">
    <div class="orb o1" id="o1"></div>
    <div class="orb o2" id="o2"></div>
    <button class="play" id="play" aria-label="Play">
      <svg id="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
  </div>
  <div class="cue" id="cue">a ten-second breath: in, then out</div>

  <p class="label">Sound</p>
  <div class="row" id="sounds">
    <button class="chip" data-s="pink" aria-pressed="true">Soft</button>
    <button class="chip" data-s="brown" aria-pressed="false">Deep</button>
    <button class="chip" data-s="white" aria-pressed="false">Bright</button>
  </div>

  <p class="label">Stop after</p>
  <div class="row" id="timers">
    <button class="chip" data-m="10" aria-pressed="true">10 min</button>
    <button class="chip" data-m="20" aria-pressed="false">20 min</button>
    <button class="chip" data-m="45" aria-pressed="false">45 min</button>
    <button class="chip" data-m="0" aria-pressed="false">Keep going</button>
  </div>

  <label class="vol">Volume <input type="range" id="vol" min="0" max="100" value="55"></label>
  <div class="left" id="left"></div>

  <footer>From <a href="https://github.com/th3kumar/Snoozz-Sleeping-Buddy">Snoozz</a>, a white-noise app for Android · <a href="https://github.com/th3kumar">@th3kumar</a></footer>
</main>

<script>
{
  const BREATH = 10;                       // seconds per full breath, matches the profile card
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let ctx, master, breathGain, src, filter, lfo, start = 0, playing = false, sound = 'pink', minutes = 10, endAt = 0, raf = 0, stopTimer = 0;

  function noiseBuffer(kind) {
    const len = ctx.sampleRate * 8, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        if (kind === 'white') d[i] = w * 0.35;
        else if (kind === 'brown') { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
        else { // pink (Paul Kellet)
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
          b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
          d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11; b6 = w * 0.115926;
        }
      }
      // crossfade the loop seam
      const f = 2048; for (let i = 0; i < f; i++) { const k = i / f; d[i] = d[i] * k + d[len - f + i] * (1 - k); }
    }
    return buf;
  }

  function setup() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0;
    breathGain = ctx.createGain(); breathGain.gain.value = 0.72;
    filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 5200; filter.Q.value = 0.3;
    lfo = ctx.createOscillator(); lfo.frequency.value = 1 / BREATH;
    const depth = ctx.createGain(); depth.gain.value = 0.28;
    lfo.connect(depth).connect(breathGain.gain);
    filter.connect(breathGain).connect(master).connect(ctx.destination);
    lfo.start(); start = ctx.currentTime;
  }

  function useSound(kind) {
    if (!ctx) return;
    const old = src;
    src = ctx.createBufferSource(); src.buffer = noiseBuffer(kind); src.loop = true;
    const g = ctx.createGain(); g.gain.value = 0; src.connect(g).connect(filter); src.start();
    g.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.2);
    if (old) { const og = old._g; og.gain.cancelScheduledValues(ctx.currentTime); og.gain.setValueAtTime(og.gain.value, ctx.currentTime);
      og.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2); old.stop(ctx.currentTime + 1.3); }
    src._g = g;
  }

  const vol = () => ($('vol').value / 100) ** 2 * 0.9;

  function frame() {
    const t = ctx.currentTime - start, ph = Math.sin(2 * Math.PI * t / BREATH), rising = Math.cos(2 * Math.PI * t / BREATH) > 0;
    if (!reduce) { $('o1').style.transform = `scale(${0.97 + 0.15 * ph})`; $('o2').style.transform = `scale(${0.95 + 0.13 * ph})`; }
    const cue = rising ? 'breathe in…' : 'and out…';
    if ($('cue').textContent !== cue) $('cue').textContent = cue;
    if (endAt) { const s = Math.max(0, Math.round(endAt - Date.now() / 1000)); $('left').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left`; }
    raf = requestAnimationFrame(frame);
  }

  function setIcon(p) {
    $('ico').innerHTML = p ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/>' : '<path d="M8 5.5v13l11-6.5z"/>';
    $('play').setAttribute('aria-label', p ? 'Pause' : 'Play');
  }

  function armTimer() {
    clearTimeout(stopTimer); endAt = 0; $('left').textContent = '';
    if (playing && minutes) { endAt = Date.now() / 1000 + minutes * 60; stopTimer = setTimeout(pause, minutes * 60000); }
  }

  async function play() {
    if (!ctx) { setup(); useSound(sound); }
    await ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(vol(), ctx.currentTime + 2.5);
    playing = true; setIcon(true); armTimer(); cancelAnimationFrame(raf); frame();
  }

  function pause() {
    if (!ctx) return;
    playing = false; setIcon(false); clearTimeout(stopTimer); endAt = 0;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + 2);
    setTimeout(() => { if (!playing) { ctx.suspend(); cancelAnimationFrame(raf); $('cue').textContent = 'paused. come back any time'; $('left').textContent = ''; } }, 2100);
  }

  $('play').addEventListener('click', () => playing ? pause() : play().catch(() => { $('cue').textContent = 'your browser blocked audio here'; }));
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); $('play').click(); } });

  const pick = (wrap, attr, fn) => wrap.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    wrap.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); fn(b.dataset[attr]);
  });
  pick($('sounds'), 's', k => { sound = k; useSound(k); });
  pick($('timers'), 'm', m => { minutes = +m; armTimer(); });
  $('vol').addEventListener('input', () => { if (ctx && playing) master.gain.setTargetAtTime(vol(), ctx.currentTime, 0.1); });
}
</script>
</body>
</html>
